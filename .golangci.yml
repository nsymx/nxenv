version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gofmt
    - goimorts
    - gosec

exclusions:
  generated: strict

  presets:
    - comments
    - common-false-positives
    - std-error-handling

paths:
  - third_party$
  - builtin$
  - examples$
  - vendor$
